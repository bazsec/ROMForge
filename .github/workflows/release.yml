name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock', '.cargo/**') }}
      - name: Validate version and tag
        shell: bash
        run: |
          VERSION=$(tr -d '\r\n' < VERSION)
          [[ "$VERSION" =~ ^v[0-9]{3,}$ ]]
          test "$GITHUB_REF" = "refs/tags/$VERSION"
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build and verify Windows release
        if: runner.os == 'Windows'
        run: ./scripts/package-windows-release.ps1
      - name: Build and verify macOS Apple Silicon release
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          git clone https://github.com/libretro/snes9x.git vendor/snes9x
          git -C vendor/snes9x checkout fae2fea08f74180759ef540ee94259213f503480
          python3 scripts/build-snes9x-macos.py
          sh scripts/build-nestopia-macos.sh
          zsh scripts/package-release.sh
          python3 scripts/make-test-rom.py artifacts/release-test.sfc
          target/release/romforge-builder --macos artifacts/ROMForge.app/Contents/MacOS/romforge-runtime vendor/snes9x/libretro/snes9x_libretro.dylib third-party/Snes9x-LICENSE.txt artifacts/release-test.sfc artifacts/ReleaseTest.app
          artifacts/ReleaseTest.app/Contents/MacOS/Game --headless
          python3 scripts/make-nes-test-rom.py artifacts/release-test.nes
          target/release/romforge-builder --macos artifacts/ROMForge.app/Contents/MacOS/romforge-runtime vendor/nestopia/libretro/nestopia_libretro.dylib third-party/Nestopia-LICENSE.txt artifacts/release-test.nes artifacts/ReleaseTestNES.app
          artifacts/ReleaseTestNES.app/Contents/MacOS/Game --headless
      - name: Audit release archives
        run: python scripts/audit-release.py artifacts/releases
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            artifacts/releases/*.zip
            artifacts/releases/*.tar.gz
            artifacts/releases/*-Setup.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/releases
          pattern: release-*
          merge-multiple: true
      - name: Verify assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(tr -d '\r\n' < VERSION)
          test "$GITHUB_REF" = "refs/tags/$VERSION"
          python3 scripts/audit-release.py artifacts/releases
          test -f "artifacts/releases/ROMForge-$VERSION-Windows-x64.zip"
          test -f "artifacts/releases/ROMForge-$VERSION-Windows-x64-Setup.exe"
          test -f "artifacts/releases/ROMForge-$VERSION-macOS-arm64.zip"
          test -f "artifacts/releases/ROMForge-$VERSION-emulator-sources.tar.gz"
          (cd artifacts/releases && sha256sum *.zip *.tar.gz *-Setup.exe > SHA256SUMS.txt)
          python3 -c "from pathlib import Path; text=Path('CHANGELOG.md').read_text(); version=Path('VERSION').read_text().strip(); notes=text.split('## '+version+'\n',1)[1].split('\n## ',1)[0].strip(); Path('release-notes.txt').write_text(notes+'\n\nDownloads: Windows x64 installer, Windows portable ZIP, and macOS Apple Silicon. Run the Windows Setup executable for Start menu shortcuts and uninstall support, or extract the portable ZIP. Windows builds are unsigned; macOS builds use local ad-hoc signing and are not notarized. No commercial ROMs or game artwork are included. Windows update installation is manual.\n')"
          gh release create "$VERSION" artifacts/releases/*.zip artifacts/releases/*.tar.gz artifacts/releases/*-Setup.exe artifacts/releases/SHA256SUMS.txt --verify-tag --title "ROMForge $VERSION" --notes-file release-notes.txt --latest
